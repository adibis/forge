name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Check formatting
        run: zig fmt --check src build.zig

  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            zig_host: x86_64-linux
          - os: macos-latest
            zig_host: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-${{ matrix.zig_host }}-0.16.0.tar.xz" | tar -xJ
          echo "$PWD/zig-${{ matrix.zig_host }}-0.16.0" >> "$GITHUB_PATH"

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

  cross-compile:
    # Build-only check (no test run) across every target release.yml ships,
    # plus small-SBC targets relevant to the edge/tiny-LLM use case, so a
    # target that fails to cross-compile (e.g. missing link_libc) is caught
    # on every PR instead of when cutting a release.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux-musl
            cpu: baseline
          - target: aarch64-linux-musl
            cpu: baseline
          - target: aarch64-macos
            cpu: baseline
          - target: x86_64-macos
            cpu: baseline
          - target: arm-linux-musleabihf
            cpu: arm1176jzf_s # Raspberry Pi Zero / Zero W / Pi 1
          - target: arm-linux-musleabihf
            cpu: cortex_a7 # Banana Pi Zero, Orange Pi Zero, Pi 2
          - target: riscv64-linux-musl
            cpu: baseline # modern RISC-V SBCs (Milk-V Duo, VisionFive, BPI-F3)
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build for ${{ matrix.target }} (${{ matrix.cpu }})
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }}
